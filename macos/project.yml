name: YTMusic
options:
  bundleIdPrefix: com.ahmed
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-" # ad-hoc; set a team to distribute
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  YTMusic:
    type: application
    platform: macOS
    sources:
      - path: YTMusic
      - path: ../shared/bridge
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: YT Music
        PRODUCT_MODULE_NAME: YTMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmed.ytmusic
        CODE_SIGN_ENTITLEMENTS: YTMusic/Resources/YTMusic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YTMusic/Resources/Info.plist
    info:
      path: YTMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: YT Music
        CFBundleName: YT Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Unofficial client. Not affiliated with Google or YouTube."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
